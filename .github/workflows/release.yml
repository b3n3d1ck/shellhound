name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          targets="linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            out="shellhound_${VERSION}_${os}_${arch}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            echo "building $out$ext"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "-s -w" -o "dist/${out}${ext}" .
            ( cd dist && if [ "$os" = "windows" ]; then zip -q "${out}.zip" "${out}${ext}"; rm "${out}${ext}"; else tar czf "${out}.tar.gz" "${out}${ext}"; rm "${out}${ext}"; fi )
          done
          ls -la dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
